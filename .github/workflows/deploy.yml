name: Deploy via FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
    - name: Get Latest Code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install & Build Assets
      run: |
        npm install
        npm run build

    - name: Sync Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/thedarkandbright.com/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          .env
          phpunit.xml
          README.md
          **/vendor/**

    - name: Run FTP Diagnostics
      run: |
        python3 -c '
        import ftplib
        import urllib.request
        import json
        try:
            print("Connecting to FTP...")
            ftp = ftplib.FTP("${{ secrets.FTP_SERVER }}")
            ftp.login("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
            pwd = ftp.pwd()
            output = f"FTP PWD: {pwd}\n\n"
            
            files = []
            ftp.dir(files.append)
            output += "FTP ROOT DIR LIST:\n" + "\n".join(files) + "\n\n"
            
            for path in ["public_html", "thedarkandbright.com", "public_html/thedarkandbright.com"]:
                try:
                    subfiles = []
                    ftp.dir(path, subfiles.append)
                    output += f"FTP DIR {path} LIST:\n" + "\n".join(subfiles) + "\n\n"
                except Exception as ex:
                    output += f"FTP DIR {path} ERROR: {str(ex)}\n\n"
            
            ftp.quit()
            
            # Post output to our server
            req = urllib.request.Request(
                "https://thedarkandbright.com/diagnose-ftp.php?token=bPXwtuggH5qk81",
                data=output.encode("utf-8"),
                headers={"Content-Type": "text/plain"},
                method="POST"
            )
            with urllib.request.urlopen(req) as res:
                print("Diagnostics sent successfully. Server responded:", res.read().decode())
        except Exception as e:
            print("Diagnostics script error:", str(e))
        ' || true

    - name: Trigger Post-Deployment Artisan Tasks
      run: |
        curl -i "https://thedarkandbright.com/deploy-maintenance-trigger?token=bPXwtuggH5qk81"
