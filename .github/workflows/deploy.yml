name: Deploy to Server via SSH

on:
  push:
    branches:
      - main # Ganti dengan branch utama Anda jika bukan main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan dengan versi PHP project Anda
          extensions: mbstring, xml, ctype, iconv, mysql, zip

      - name: Install Composer Dependencies
        run: |
          composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build NPM Assets
        run: |
          npm ci
          npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Matikan mode maintenance (opsional, jika ingin)
            php artisan down || true
            
            # Tarik kode terbaru dari git
            git pull origin main
            
            # Install dependensi PHP terbaru
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            
            # Registrasi Package Laravel secara manual
            php artisan package:discover --ansi || true
            
            # Jalankan migrasi database
            php artisan migrate --force
            
            # Bersihkan dan optimalkan cache Laravel
            php artisan optimize
            php artisan view:cache
            php artisan event:cache
            
            # Nyalakan kembali aplikasi
            php artisan up
            
            echo "🚀 Deployment Berhasil!"
